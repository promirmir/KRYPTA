plugins {
    id 'com.android.application'
}

android {
    namespace 'io.krypta.research'
    compileSdk 35

    defaultConfig {
        applicationId 'io.krypta.research'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.4.1-alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}