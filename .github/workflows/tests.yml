name: KRYPTA / file vault tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest PR head is relevant: previous unfinished test runs for the
# same PR can otherwise monopolize Windows runners and delay security reviews.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  unit:
    name: unit / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.11'
          - os: ubuntu-22.04
            python-version: '3.13'
          - os: windows-2022
            python-version: '3.11'
          - os: windows-2022
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Select private Windows test ancestry
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:USERPROFILE "Documents/krypta-ci-${{ github.run_id }}-${{ matrix.python-version }}"
          New-Item -ItemType Directory -Path $testRoot -ErrorAction Stop | Out-Null
          "TMP=$testRoot" >> $env:GITHUB_ENV
          "TEMP=$testRoot" >> $env:GITHUB_ENV
      - name: Verify unit and adversarial regression tests
        run: python -m pytest -q

  rescue-binary:
    name: rescue binary / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies
        run: python -m pip install -e '.[test]' pyinstaller==6.16.0
      - name: Select private Windows test ancestry
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:USERPROFILE "Documents/krypta-binary-${{ github.run_id }}-${{ matrix.python-version }}"
          New-Item -ItemType Directory -Path $testRoot -ErrorAction Stop | Out-Null
          "TMP=$testRoot" >> $env:GITHUB_ENV
          "TEMP=$testRoot" >> $env:GITHUB_ENV
      - name: Build actual standalone rescue executable
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name KRYPTA-Rescue krypta/rescue_entry.py
      - name: Execute packaged Windows rescue self-test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./dist/KRYPTA-Rescue.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged rescue self-test failed" }
      - name: Execute packaged Linux rescue self-test
        if: runner.os == 'Linux'
        run: ./dist/KRYPTA-Rescue --self-test

  native-winfsp-lifecycle:
    name: native WinFsp mount / Windows 2022
    runs-on: windows-2022
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies and native Python binding
        run: python -m pip install -e '.[test]' winfspy==0.8.4
      - name: Install hash-verified WinFsp runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.2.26194.msi'
          Invoke-WebRequest -Uri 'https://github.com/winfsp/winfsp/releases/download/v2.2B3/winfsp-2.2.26194.msi' -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne '7B41020618CDCC33D699D0E15C1DF660F0762A09B57080049C565857AC00BD9D') {
            throw 'WinFsp MSI hash mismatch'
          }
          $process = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "WinFsp install failed: $($process.ExitCode)" }
          $dir = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\WinFsp' -ErrorAction SilentlyContinue).InstallDir
          if (-not $dir) { $dir = (Get-ItemProperty 'HKLM:\SOFTWARE\WinFsp' -ErrorAction SilentlyContinue).InstallDir }
          if (-not $dir -or -not (Test-Path (Join-Path $dir 'bin'))) { throw 'Native WinFsp binaries missing' }
          "WINFSP_LIBRARY_PATH=$dir" >> $env:GITHUB_ENV
      - name: Require actual native mount lifecycle
        shell: pwsh
        run: |
          python -m tools.test_windows_winfsp_mount_lifecycle
          if ($LASTEXITCODE -ne 0) { throw 'Native WinFsp mount smoke test failed' }
          python -m tools.test_windows_winfsp_owner_read
