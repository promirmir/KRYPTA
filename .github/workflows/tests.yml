name: KRYPTA / file vault tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: unit / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.11'
          - os: ubuntu-22.04
            python-version: '3.13'
          - os: windows-2022
            python-version: '3.11'
          - os: windows-2022
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify unit and adversarial regression tests
        run: python -m pytest -q