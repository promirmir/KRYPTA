name: KRYPTA / Desktop alpha builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'krypta/**'
      - 'research/**'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: KRYPTA-Windows-x64-alpha
          - os: ubuntu-22.04
            artifact: KRYPTA-Linux-x64-alpha
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Linux GUI runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libtk8.6 libtcl8.6
      - name: Install dependencies and PyInstaller
        run: python -m pip install -e '.[test]' pyinstaller==6.16.0
      - name: Run cryptographic regression tests
        run: python -m pytest -q
      - name: Build local GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name KRYPTA krypta/desktop_entry.py
      - name: Verify Windows output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/KRYPTA.exe')) { throw 'EXE build not found' }
          $digest = (Get-FileHash 'dist/KRYPTA.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  KRYPTA.exe" | Set-Content -LiteralPath 'dist/KRYPTA.exe.sha256' -Encoding ascii
          if (!(Test-Path 'dist/KRYPTA.exe.sha256')) { throw 'Checksum manifest missing' }
          $probe = Start-Process -FilePath (Resolve-Path 'dist/KRYPTA.exe').Path -ArgumentList '--self-test' -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "Packaged Windows EXE self-test failed: $($probe.ExitCode)" }
          $volumeProbe = Start-Process -FilePath (Resolve-Path 'dist/KRYPTA.exe').Path -ArgumentList '--volume-self-test' -Wait -PassThru
          if ($volumeProbe.ExitCode -ne 0) { throw "Packaged Windows independent volume smoke test failed: $($volumeProbe.ExitCode)" }
          $filesystemProbe = Start-Process -FilePath (Resolve-Path 'dist/KRYPTA.exe').Path -ArgumentList '--filesystem-self-test' -Wait -PassThru
          if ($filesystemProbe.ExitCode -ne 0) { throw "Packaged Windows filesystem/migration test failed: $($filesystemProbe.ExitCode)" }
      - name: Verify Linux output
        if: runner.os == 'Linux'
        run: |
          test -s dist/KRYPTA
          chmod +x dist/KRYPTA
          (cd dist && sha256sum KRYPTA > KRYPTA.sha256 && sha256sum -c KRYPTA.sha256)
          ./dist/KRYPTA --self-test
          ./dist/KRYPTA --volume-self-test
          ./dist/KRYPTA --filesystem-self-test
      - name: Upload private research artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && 'dist/KRYPTA.exe*' || 'dist/KRYPTA*' }}
          if-no-files-found: error
          retention-days: 14