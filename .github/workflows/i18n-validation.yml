name: KRYPTA / localized UI validation

on:
  push:
    branches: [main]
    paths:
      - 'krypta/i18n.py'
      - 'krypta/gui.py'
      - 'tools/sync_android_strings.py'
      - 'android/app/src/main/res/**'
      - 'tests/test_i18n.py'
      - 'tests/test_desktop_languages.py'
      - '.github/workflows/i18n-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-i18n:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native Tk and virtual desktop
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb fonts-noto-core fonts-noto-cjk
      - name: Install project and test tools
        run: python -m pip install -e '.[test]'
      - name: Check Android resource generation
        run: python tools/sync_android_strings.py --check
      - name: Exercise language switcher for every locale
        run: xvfb-run -a python -m pytest -q tests/test_i18n.py tests/test_desktop_languages.py