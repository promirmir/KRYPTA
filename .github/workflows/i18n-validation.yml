name: KRYPTA / localized UI validation

on:
  push:
    branches: [main]
    paths:
      - 'krypta/i18n.py'
      - 'krypta/gui.py'
      - 'tools/sync_android_strings.py'
      - 'android/app/src/main/res/**'
      - 'tests/test_i18n.py'
      - 'tests/test_desktop_languages.py'
      - 'tests/test_volume_lab_gui.py'
      - '.github/workflows/i18n-validation.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'krypta/i18n.py'
      - 'krypta/gui.py'
      - 'tools/sync_android_strings.py'
      - 'android/app/src/main/res/**'
      - 'tests/test_i18n.py'
      - 'tests/test_desktop_languages.py'
      - 'tests/test_volume_lab_gui.py'
      - '.github/workflows/i18n-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-i18n:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native Tk, Xvfb and full Noto fonts without slow Azure mirror
        shell: bash
        run: |
          set -euo pipefail
          # Azure archive throughput was insufficient for the 61 MB Noto CJK
          # package and timed out before ANY GUI tests could run (PR #54).
          # Keep the exact dependency list and all graphical assertions.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list; do
            if [ -f "$source" ]; then
              sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
            install -y --no-install-recommends python3-tk xvfb fonts-noto-core fonts-noto-cjk
          command -v Xvfb
          fc-match -f '%{family}\n' 'Noto Sans CJK JP' | grep -q 'Noto'
          fc-match -f '%{family}\n' 'Noto Sans Arabic' | grep -q 'Noto'
      - name: Install project and test tools
        run: python -m pip install -e '.[test]'
      - name: Check Android resource generation
        run: python tools/sync_android_strings.py --check
      - name: Exercise language switcher for every locale
        run: xvfb-run -a python -m pytest -q tests/test_i18n.py tests/test_desktop_languages.py tests/test_volume_lab_gui.py