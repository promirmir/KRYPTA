name: KRYPTA / Windows experimental read-only mount EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/windows_mount_readonly.py'
      - 'tools/test_windows_winfsp_cli_native.py'
      - 'research/windows_winfsp_readonly.py'
      - '.github/workflows/windows-winfsp-mount-exe.yml'
  push:
    branches: [main]
    paths:
      - 'tools/windows_mount_readonly.py'
      - 'tools/test_windows_winfsp_cli_native.py'
      - 'research/windows_winfsp_readonly.py'
      - '.github/workflows/windows-winfsp-mount-exe.yml'

permissions:
  contents: read

jobs:
  package-test-cli:
    name: Build isolated WinFsp mount research EXE / Windows 2022
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Python runtime and packager
        run: python -m pip install -e '.[test]' winfspy==0.8.4 pyinstaller==6.16.0
      - name: Install SHA-256 verified WinFsp native runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.2.26286.msi'
          Invoke-WebRequest -Uri 'https://github.com/winfsp/winfsp/releases/download/v2.2B5/winfsp-2.2.26286.msi' -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne '293FFB9BCC0B625C85079FE85FA77F8FE98170ABA51A02AC9C83D58F6C3B0E2F') {
            throw 'WinFsp runtime SHA-256 mismatch'
          }
          $process = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "WinFsp install failed: $($process.ExitCode)" }
          $dir = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\WinFsp' -ErrorAction SilentlyContinue).InstallDir
          if (-not $dir) { $dir = (Get-ItemProperty 'HKLM:\SOFTWARE\WinFsp' -ErrorAction SilentlyContinue).InstallDir }
          if (-not $dir -or -not (Test-Path (Join-Path $dir 'bin'))) { throw 'WinFsp runtime missing' }
          "WINFSP_LIBRARY_PATH=$dir" >> $env:GITHUB_ENV
      - name: Build separate console EXE, not desktop GUI
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name KRYPTA-Windows-ReadOnly-Mount-TEST tools/windows_mount_readonly.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller Windows research mount build failed' }
      - name: Verify packaged CLI help and calculate SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'dist/KRYPTA-Windows-ReadOnly-Mount-TEST.exe'
          if (!(Test-Path $file)) { throw 'Packaged EXE was not generated' }
          & $file --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged EXE argument parser failed' }
          & $file --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged EXE native encrypted image mount/unmount self-test failed' }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'dist/KRYPTA-Windows-ReadOnly-Mount-TEST.exe.sha256'),
            ($hash + '  KRYPTA-Windows-ReadOnly-Mount-TEST.exe' + [char]10),
            [System.Text.Encoding]::ASCII
          )
      - name: Upload disposable development artifact (NOT a public release)
        uses: actions/upload-artifact@v4
        with:
          name: krypta-windows-readonly-mount-experimental-exe
          path: |
            dist/KRYPTA-Windows-ReadOnly-Mount-TEST.exe
            dist/KRYPTA-Windows-ReadOnly-Mount-TEST.exe.sha256
          if-no-files-found: error
          retention-days: 14
