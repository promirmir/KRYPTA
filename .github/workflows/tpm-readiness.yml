name: KRYPTA / Windows TPM read-only checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/Get-KryptaTpmReadiness.ps1'
      - 'windows/Test-KryptaTpmKey.ps1'
      - 'windows/Test-KryptaTpmWrap.ps1'
      - 'windows/Test-KryptaSoftwareCngOaep.ps1'
      - 'krypta/hardware_readiness.py'
      - 'tests/test_hardware_readiness.py'
      - '.github/workflows/tpm-readiness.yml'

permissions:
  contents: read

jobs:
  windows-readiness:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read-only Windows TPM capability probe
        shell: pwsh
        run: |
          $result = & ./windows/Get-KryptaTpmReadiness.ps1 | ConvertFrom-Json
          if ($result.schema -ne 'KRYPTA-TPM-READINESS/1') { throw 'Wrong schema' }
          if ($result.read_only -ne $true) { throw 'Unsafe report state' }
          if ($result.security_assurance.pin_anti_hammering_verified -ne $false) { throw 'False security claim' }
          if ($result.security_assurance.tpm_key_operations_tested -ne $false) { throw 'No key test was performed' }
          Write-Host "TPM present: $($result.tpm.present); KSP opened: $($result.platform_crypto_provider.can_open)"
          Write-Host 'This GitHub runner is NOT a valid hardware-PIN anti-hammering test.'
      - name: Verify disposable key test is strictly opt-in (no hardware action)
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './windows/Test-KryptaTpmKey.ps1').Path,
            [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'TPM prototype PowerShell parse failed' }
          $probe = & ./windows/Test-KryptaTpmKey.ps1 | ConvertFrom-Json
          if ($probe.Status -ne 'NOT_RUN') { throw 'Unexpected TPM key creation on default invocation' }
          if ($probe.EncryptionEnabled -ne $false) { throw 'Incorrect encryption status' }
          if ($probe.EnforcedPinRetryLimitVerified -ne $false) { throw 'Incorrect PIN protection status' }
          if ($probe.SignatureVerified -ne $false) { throw 'No signing operation may run by default' }
          Write-Host 'PowerShell parsed; opt-in default reported NOT_RUN; no key created'
      - name: Verify wrapped-key POC parses and does NOTHING by default
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './windows/Test-KryptaTpmWrap.ps1').Path,
            [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'TPM wrap POC syntax errors' }
          $probe = & ./windows/Test-KryptaTpmWrap.ps1 | ConvertFrom-Json
          if ($probe.Schema -ne 'KRYPTA-TPM-WRAP-POC/1') { throw 'Wrong schema' }
          if ($probe.Status -ne 'NOT_RUN') { throw 'Unexpected test key operation without consent' }
          if ($probe.WrappedKeyRoundTripVerified -ne $false) { throw 'False key protection claim' }
          if ($probe.HardwarePinAntiHammeringVerified -ne $false) { throw 'False PIN rate-limit claim' }
          if ($probe.PcrBindingVerified -ne $false) { throw 'False measured boot claim' }
          if ($probe.DiskEncryptionEnabled -ne $false) { throw 'Unexpected encryption claim' }
          if ($null -ne $probe.CleanupSucceeded) { throw 'Cleanup attempted without a key' }
          Write-Host 'Safe default verified. No key created or modified.'
      - name: Verify OAEP-256 using ephemeral SOFTWARE CNG only (not TPM)
        shell: pwsh
        run: |
          $r = & ./windows/Test-KryptaSoftwareCngOaep.ps1 | ConvertFrom-Json
          if ($r.Schema -ne 'KRYPTA-SOFTWARE-CNG-SMOKE/1') { throw 'Wrong software test schema' }
          if ($r.Provider -ne 'Microsoft Software Key Storage Provider') { throw 'Unexpected CNG provider' }
          if ($r.KeyType -ne 'ephemeral') { throw 'Persistent key is forbidden' }
          if ($r.RsaOaep256RoundTrip -ne $true) { throw 'RSA OAEP round-trip failed' }
          if ($r.TamperRejected -ne $true) { throw 'OAEP tamper rejection failed' }
          if ($r.WrongKeyRejected -ne $true) { throw 'OAEP wrong-key rejection failed' }
          if ($r.HardwareTpmVerified -ne $false -or $r.HardwarePinAntiHammeringVerified -ne $false) {
            throw 'Software test must never claim TPM or PIN anti-hammering'
          }
          Write-Host 'Software CNG RSA-OAEP-SHA256 check passed. No hardware TPM was tested.'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate fail-closed advisory reporting
        shell: pwsh
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_hardware_readiness.py