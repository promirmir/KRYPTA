name: KRYPTA / mandatory WinFsp binding contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  winfspy-native-binding:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KRYPTA and pinned native Python bindings
        run: python -m pip install -e '.[test]' winfspy==0.8.4
      - name: Install verified WinFsp runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/winfsp/winfsp/releases/download/v2.2B5/winfsp-2.2.26286.msi'
          $expected = '293FFB9BCC0B625C85079FE85FA77F8FE98170ABA51A02AC9C83D58F6C3B0E2F'
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.2.26286.msi'
          Invoke-WebRequest -Uri $uri -OutFile $msi
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'WinFsp MSI SHA256 mismatch' }
          $process = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw "WinFsp installer failed: $($process.ExitCode)" }
          $reg = 'HKLM:\SOFTWARE\WOW6432Node\WinFsp'
          $installDir = (Get-ItemProperty -Path $reg -ErrorAction SilentlyContinue).InstallDir
          if (-not $installDir) {
            $installDir = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WinFsp' -ErrorAction SilentlyContinue).InstallDir
          }
          if (-not $installDir -or -not (Test-Path (Join-Path $installDir 'bin'))) {
            throw 'WinFsp library path unavailable after install'
          }
          "WINFSP_LIBRARY_PATH=$installDir" >> $env:GITHUB_ENV
      - name: Require native binding import (no skip)
        shell: pwsh
        run: |
          python -c "import winfspy; assert hasattr(winfspy, 'BaseFileSystemOperations')"
          if ($LASTEXITCODE -ne 0) { throw 'Native winfspy binding missing or incompatible' }
      - name: Execute native-binding test without skips
        run: python -m pytest -q -rs tests/test_windows_winfsp_native_contract.py
      - name: Native ephemeral WinFsp mount and unmount
        shell: pwsh
        run: |
          python tools/test_windows_winfsp_mount_lifecycle.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WinFsp mount lifecycle failed' }
      - name: Explain remaining gate
        run: |
          echo "Lifecycle test only: WinFsp start/stop is checked, but ACL-gated Explorer access and file I/O are NOT certified."
