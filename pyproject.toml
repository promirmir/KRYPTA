[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krypta-vault"
version = "0.4.0a0"
description = "Research-only authenticated file vault prototype, not production encryption"
requires-python = ">=3.10"
dependencies = ["cryptography>=50.0.2,<51", "argon2-cffi>=23,<26"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["krypta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]